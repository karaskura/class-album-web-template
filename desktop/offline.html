<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>ClassAlbum · 连接失败</title>
<style>
  :root { --ink: #4b4238; --muted: #9a8f83; --accent: #d98d75; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #f7f4ee;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    user-select: none;
  }
  .box { text-align: center; padding: 40px; max-width: 520px; }
  .logo { width: 96px; height: 96px; border-radius: 50%; margin-bottom: 18px; box-shadow: 0 8px 22px rgba(120,90,70,.2); }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 13px; line-height: 1.7; color: var(--muted); margin: 0 0 6px; }
  code { font-size: 12px; color: #8a7f72; word-break: break-all; }
  button {
    margin-top: 22px;
    padding: 10px 28px;
    font-size: 14px;
    color: #fff;
    background: var(--accent);
    border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(217, 141, 117, 0.35);
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="build/icon-256.png" alt="ClassAlbum" />
    <h1>暂时连不上服务器</h1>
    <p>可能是网络波动，或者服务器正在升级。检查一下网络后点下面重试。</p>
    <p id="detail"><code></code></p>
    <button id="retry" type="button">重新加载</button>
  </div>
  <script>
    const qs = new URLSearchParams(location.search);
    const target = qs.get('url') || '';
    const code = qs.get('code') || '';
    const desc = qs.get('desc') || '';
    document.querySelector('#detail code').textContent = target + (code ? `（${code} ${desc}）` : '');
    document.querySelector('#retry').addEventListener('click', () => {
      if (window.karaFile && window.karaFile.reload) window.karaFile.reload();
      else location.reload();
    });
    // 不自动重试，避免断网时反复打网络
  </script>
</body>
</html>
